[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epath"
version = "0.1.0"
description = "E-path BDamage calculation tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gemmi",
    "matplotlib",
    "numpy",
    "scipy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rabdam.bnet" = ["database/database.csv", "database/database.manifest.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
