# Type-checking configuration. `mypy` with no arguments checks the package
# sources and the test suite; `src` is on the path so the tests import the
# checkout directly, as the `./epath` launcher does.
[mypy]
files = src, tests
mypy_path = src
strict = True

# Older matplotlib releases ship no type information and newer ones do, so
# missing stubs are tolerated here rather than with an inline ignore that
# becomes unused on one side or the other.
[mypy-matplotlib.*]
ignore_missing_imports = True
